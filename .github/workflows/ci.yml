name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rake:
    name: rake (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '4.0'] # the minimum (required_ruby_version) and the latest stable
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake

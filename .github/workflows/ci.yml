name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rake:
    name: rake (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '4.0'] # the minimum (required_ruby_version) and the latest stable
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake
      - uses: codecov/codecov-action@v5
        if: matrix.ruby == '4.0'
        with:
          files: coverage/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  rack2:
    name: rspec (Rack 2.2)
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: gemfiles/rack2.gemfile
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec rspec

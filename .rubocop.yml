AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'

# Example groups, shared examples above all, grow past the default length.
Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

# Reek rejects one-letter names such as `e`.
Naming/RescuedExceptionsVariableName:
  PreferredName: error

# Steep reads `#: Type` assertions where it cannot infer a tuple's type.
Layout/LeadingCommentSpace:
  AllowRBSInlineAnnotation: true
